[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_mockvla"
version = "0.1.0"
description = "Headless mock robot plugin for lerobot-rollout smoke tests (no hardware required)"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["lerobot_robot_mockvla"]
